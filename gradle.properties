# Gradle Properties
org.gradle.jvmargs = -Xmx3G

# Source Options
use_modern_java_syntax = true
use_jetbrains_annotations = false

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = false
show_testing_output = false

# Mod Information
mod_version = 1.8.1
root_package = com.gtceu.compat
mod_id = gtceu_compat
mod_name = GTCEu Compatibility Layer

# Mod Metadata
mod_description = Provides backward and forward compatibility between GTCEu 2.8 and 2.9 APIs
mod_url = https://github.com/GregTechCEu/GregTech
mod_authors = Community
mod_credits = GregTechCEu Team

# Mapping Properties
mapping_channel = stable
mapping_version = 39
use_dependency_at_files = false

# Run Configurations
minecraft_username = Developer
extra_jvm_args =
extra_tweak_classes =

# Publishing
publish_to_maven = false
publish_to_local_maven = false
maven_name = ${mod_name}
maven_url =

# Coremod Configuration - Need this for runtime class transformation
is_coremod = true
coremod_includes_mod = true
coremod_plugin_class_name = com.gtceu.compat.core.GTCEuCompatLoadingPlugin

# Mixins - disabled, using pure reflection instead
use_mixins = false
mixin_booter_version = 10.7
generate_mixins_json = false
mixin_configs = gtceu_compat
mixin_refmap = mixins.gtceu_compat.refmap.json

# Access Transformers
use_access_transformer = false
access_transformer_locations = ${mod_id}_at.cfg

# Tags
use_tags = true
tag_class_name = ${root_package}.${mod_id}.Tags

# AssetMover
use_asset_mover = false
asset_mover_version = 2.5

# Publishing to CurseForge
publish_to_curseforge = false
curseforge_project_id =
curseforge_debug = false

# Publishing to Modrinth
publish_to_modrinth = false
modrinth_project_id =
modrinth_sync_readme = false
modrinth_debug = false

# Misc
change_minecraft_sources = false
